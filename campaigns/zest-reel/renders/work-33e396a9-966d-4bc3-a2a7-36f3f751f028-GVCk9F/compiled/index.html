      :root {
        --blush: #fec4ca; --pink: #fe7b8e; --berry: #a80836; --berry-deep: #6e0322;
        --coral: #fe4b54; --leaf: #3c8a2e; --cream: #fff4f1; --rind: #ffad4a; --rind-deep: #e8742a;
        --font-display: "Anton", sans-serif; --font-caption: "Bricolage", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--blush); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      .halftone::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(rgba(168, 8, 54, 0.16) 3.2px, transparent 3.6px); background-size: 22px 22px;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 100%);
      }
      .slam { position: absolute; font-family: var(--font-display); text-transform: uppercase; line-height: 0.86; letter-spacing: -0.01em; white-space: nowrap; }
      .slam span { display: inline-block; }
      .can { position: absolute; width: auto; will-change: transform; }
      .sticker { position: absolute; font-family: var(--font-display); text-transform: uppercase; padding: 14px 30px 18px; border: 6px solid var(--berry); border-radius: 999px; box-shadow: 8px 8px 0 var(--berry); white-space: nowrap; }
      .disc { position: absolute; border-radius: 50%; overflow: hidden; }
      .disc img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* captions */
      #captions { z-index: 50; pointer-events: none; }
      .cap {
        position: absolute; left: 50%; bottom: 200px; transform: translateX(-50%); width: max-content; max-width: 940px;
        padding: 16px 30px 20px; border-radius: 26px; background: var(--berry-deep); color: var(--cream);
        font-family: var(--font-caption); font-weight: 800; font-size: 54px; line-height: 1.18; text-align: center;
        box-shadow: 0 10px 0 rgba(110, 3, 34, 0.35); opacity: 0;
      }
      .cap .w { display: inline-block; padding: 0 8px; border-radius: 12px; }
    </style>
  </head>
